spring:
  application:
    name: app-back-end-learning-core

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:to-teacher-app}

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  notification:
    push:
      enabled: ${PUSH_NOTIFICATIONS_ENABLED:false}
      provider: ${PUSH_PROVIDER:expo}
      expo:
        send-url: ${EXPO_PUSH_SEND_URL:https://exp.host/--/api/v2/push/send}
        receipt-url: ${EXPO_PUSH_RECEIPT_URL:https://exp.host/--/api/v2/push/getReceipts}
        access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
        access-token-required: ${EXPO_PUSH_ACCESS_TOKEN_REQUIRED:false}
      worker-delay: ${PUSH_WORKER_DELAY_MS:5000}
      receipt-delay: ${PUSH_RECEIPT_DELAY_SECONDS:900}s
      lease-duration: ${PUSH_LEASE_DURATION_SECONDS:120}s
      max-attempts: ${PUSH_MAX_ATTEMPTS:5}
      initial-backoff: ${PUSH_INITIAL_BACKOFF_SECONDS:30}s
      max-backoff: ${PUSH_MAX_BACKOFF_SECONDS:1800}s
      batch-size: ${PUSH_BATCH_SIZE:100}
      connect-timeout: ${PUSH_CONNECT_TIMEOUT:PT3S}
      read-timeout: ${PUSH_READ_TIMEOUT:PT10S}
  grading:
    pending-timeout: ${GRADING_PENDING_TIMEOUT:PT1M}
    processing-timeout: ${GRADING_PROCESSING_TIMEOUT:PT3M}
    max-dispatch-attempts: ${GRADING_MAX_DISPATCH_ATTEMPTS:3}
    ai-connect-timeout: ${GRADING_AI_CONNECT_TIMEOUT:PT3S}
    ai-read-timeout: ${GRADING_AI_READ_TIMEOUT:PT30S}
    summary-dispatch-threads: ${GRADING_SUMMARY_DISPATCH_THREADS:2}
    summary-dispatch-queue-capacity: ${GRADING_SUMMARY_DISPATCH_QUEUE_CAPACITY:100}
  auth:
    mode: ${APP_AUTH_MODE:legacy}
    legacy-user-id: ${LEGACY_USER_ID:00000000-0000-0000-0000-000000000001}
    identity:
      issuer: ${IDENTITY_ISSUER:}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI:}
      audience: ${IDENTITY_AUDIENCE:}
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:learning-core}
  s3:
    key-prefix: ${AWS_S3_KEY_PREFIX:app-learning-core}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 4
    max-connections: 100

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  logging:
    minimum-event-level: error
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  environment: ${spring.profiles.active:local}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    probes:
      enabled: true
