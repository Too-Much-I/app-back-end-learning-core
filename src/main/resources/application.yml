spring:
  application:
    name: app-back-end-learning-core

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:to-teacher-app}

    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  billing:
    creation-saga-enabled: ${BILLING_CREATION_SAGA_ENABLED:false}
    base-url: ${BILLING_BASE_URL:}
    region: ${BILLING_AWS_REGION:ap-northeast-2}
    connect-timeout: ${BILLING_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${BILLING_READ_TIMEOUT:PT5S}
  grading:
    pending-timeout: ${GRADING_PENDING_TIMEOUT:PT1M}
    processing-timeout: ${GRADING_PROCESSING_TIMEOUT:PT3M}
    max-dispatch-attempts: ${GRADING_MAX_DISPATCH_ATTEMPTS:3}
    ai-server-url: ${AI_SERVER_URL:http://tosunsaeng-ai:8000}
    ai-connect-timeout: ${GRADING_AI_CONNECT_TIMEOUT:PT3S}
    ai-read-timeout: ${GRADING_AI_READ_TIMEOUT:PT30S}
    summary-dispatch-threads: ${GRADING_SUMMARY_DISPATCH_THREADS:2}
    summary-dispatch-queue-capacity: ${GRADING_SUMMARY_DISPATCH_QUEUE_CAPACITY:100}
  auth:
    mode: ${APP_AUTH_MODE:legacy}
    legacy-user-id: ${LEGACY_USER_ID:00000000-0000-0000-0000-000000000001}
    identity:
      issuer: ${IDENTITY_ISSUER:}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI:}
      audience: ${IDENTITY_AUDIENCE:}
      clock-skew: ${IDENTITY_CLOCK_SKEW:PT60S}
  user-withdrawn:
    consumer-enabled: ${USER_WITHDRAWN_CONSUMER_ENABLED:false}
    deny-gate-enabled: ${USER_WITHDRAWN_DENY_GATE_ENABLED:false}
    max-accepted-access-token-lifetime: ${USER_WITHDRAWN_MAX_ACCESS_TOKEN_LIFETIME:}
    allowed-verifier-clock-skew: ${USER_WITHDRAWN_ALLOWED_VERIFIER_CLOCK_SKEW:}
    inbox-retention: ${USER_WITHDRAWN_INBOX_RETENTION:}
    maximum-future-event-skew: ${USER_WITHDRAWN_MAXIMUM_FUTURE_EVENT_SKEW:}
    workload:
      issuer: ${USER_WITHDRAWN_WORKLOAD_ISSUER:}
      jwk-set-uri: ${USER_WITHDRAWN_WORKLOAD_JWK_SET_URI:}
      audience: ${USER_WITHDRAWN_WORKLOAD_AUDIENCE:}
      principal-claim: ${USER_WITHDRAWN_WORKLOAD_PRINCIPAL_CLAIM:}
      principal-value: ${USER_WITHDRAWN_WORKLOAD_PRINCIPAL_VALUE:}
      max-token-lifetime: ${USER_WITHDRAWN_WORKLOAD_MAX_TOKEN_LIFETIME:}
      clock-skew: ${USER_WITHDRAWN_WORKLOAD_CLOCK_SKEW:}
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:learning-core}
  s3:
    key-prefix: ${AWS_S3_KEY_PREFIX:app-learning-core}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 20
      min-spare: 4
    max-connections: 100

logging:
  pattern:
    level: "%5p requestId=%X{requestId:-}"

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${spring.profiles.active:local}}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  exception-resolver-order: 1
  logging:
    enabled: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    probes:
      enabled: true
