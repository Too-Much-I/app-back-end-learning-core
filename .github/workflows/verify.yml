name: Verify Learning Core

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: learning-core-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, migration and Mongo transaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Test deployment gate and routing
        run: node --test scripts/deployment/*.test.js

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run unit tests
        env:
          SENTRY_RELEASE: app-back-end-learning-core@test
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon

      - name: Run Mongo migration tests
        run: node --test scripts/mongodb/user-merged-prepare.test.js

      - name: Run Mongo replica-set integration tests
        run: ./gradlew mongoIntegrationTest --no-daemon

      - name: Set up Python for isolated learning Lambda
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify learning release tooling and Lambda offline
        run: |
          python -m unittest discover -s scripts/answer-learning -p 'test_*.py'
          python -m pip install -r lambda/answer-learning/requirements-practice-lambda.txt pytest==9.1.1
          cd lambda/answer-learning
          python -m pytest -q

      - name: Check patch whitespace
        run: git diff --check
