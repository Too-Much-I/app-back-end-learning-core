name: Deploy Learning Core (main / develop)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'learning-core-staging-deploy' || 'learning-core-test-deploy' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: tosunsaeng-learning-core
  ECS_CLUSTER: tosunsaeng-staging-cluster
  SENTRY_RELEASE: app-back-end-learning-core@${{ github.sha }}

jobs:
  deployment-gate:
    name: Allow test deployment only after PR merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.gate.outputs.result }}
    steps:
      - uses: actions/checkout@v5
      - name: Test deployment gate and routing
        run: node --test scripts/deployment/*.test.js
      - name: Check deployment event
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const allowDeployment = require('./scripts/deployment/allow-deployment.cjs');
            return await allowDeployment({ github, context, core });

  deploy:
    needs: deployment-gate
    if: needs.deployment-gate.outputs.allowed == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Select branch-specific deployment target
        env:
          MAIN_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TEST_ROLE_ARN: ${{ vars.AWS_TEST_ROLE_ARN }}
        run: bash scripts/deployment/select-target.sh >> "$GITHUB_ENV"

      - name: Test deployment routing
        run: node --test scripts/deployment/*.test.js

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run unit and migration tests
        env:
          SENTRY_RELEASE: app-back-end-learning-core@test
        run: |
          chmod +x gradlew
          ./gradlew clean test --no-daemon
          node --test scripts/mongodb/user-merged-prepare.test.js

      - name: Run Mongo replica-set integration tests
        run: ./gradlew mongoIntegrationTest --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: learning-core-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          TASK_DEFINITION_ARN="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].taskDefinition' \
              --output text
          )"

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "::error::Could not find ECS task definition"
            exit 1
          fi

          echo "Current task definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            > task-definition.json

          # Never reuse the other environment's task family/container.
          jq -e --arg family "$TASK_FAMILY" --arg container "$CONTAINER_NAME" \
            '.family == $family and ([.containerDefinitions[] | select(.name == $container)] | length == 1)' \
            task-definition.json > /dev/null

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_ALIAS }}
          cache-from: type=gha,scope=${{ env.IMAGE_ALIAS }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_ALIAS }}

      - name: Set image URI
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Deploying image: ${IMAGE_URI}"

      - name: Render new task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image_uri }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Verify health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTH_URL"

      - name: Deployment summary
        run: |
          echo "### Learning Core ${DEPLOY_TARGET} deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${ECS_SERVICE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: ${HEALTH_URL}" >> "$GITHUB_STEP_SUMMARY"
